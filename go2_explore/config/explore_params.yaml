explorer:
  ros__parameters:
    # The object or scene description to search for.
    # Passed directly to the VLM pipeline as the GroundingDINO text prompt.
    text_prompt: "a blue backpack"

    # Camera topic used by the vision node; detections are published on
    # {image_topic}_detections.
    image_topic: /camera/color/image_raw

    # RTAB-Map occupancy grid topic.
    map_topic: /map

    # TF frames.
    robot_base_frame: base_link
    map_frame: map

    # Number of consecutive detection frames required before switching from
    # EXPLORING to NAVIGATING.  Higher values reduce false positives.
    detection_threshold: 3

    # Minimum number of frontier cells in a cluster to be considered a valid
    # navigation target.  Filters noise at map edges.
    min_frontier_size: 5

    # Radius (metres) around a failed frontier goal that will be blacklisted
    # to prevent repeated re-visits.
    frontier_blacklist_radius: 1.0

    # How far (metres) to pull the goal back from the frontier centroid toward
    # the robot.  Keeps the Nav2 goal in clear free space rather than on the
    # free/unknown boundary where the inflation layer marks cells in-collision.
    frontier_goal_offset: 0.4

    # Minimum distance (metres) from the robot to a frontier centroid.
    # Frontiers closer than this are skipped — they produce trivially short
    # nav goals that the controller satisfies without the robot actually moving.
    min_frontier_distance: 0.8

    # How many consecutive ticks with no valid frontier before relaxing
    # min_frontier_distance and trying again. At 1 Hz this is 20 seconds.
    no_frontier_idle_threshold: 20

    # Rate (Hz) at which the exploration state machine ticks.
    freq: 1.0

    # When true, disables VLM detection subscription and the NAVIGATING state.
    # The robot will explore all frontiers and then stop.  Use for autonomous
    # mapping runs without a target object.
    mapping_only: false
