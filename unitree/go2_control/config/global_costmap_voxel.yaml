global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      rolling_window: true       # required — no static map to define bounds
      width: 20
      height: 20
      footprint: "[ [0.22, 0.15], [0.22, -0.15], [-0.22, -0.15], [-0.22, 0.15] ]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.15             # start voxel grid above ground/leg level
        z_resolution: 0.05
        z_voxels: 37               # 0.15 + (37 × 0.05) = 2.0 m ceiling
        max_obstacle_height: 2.0
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: scan_cloud
        scan_cloud:
          topic: /utlidar/cloud_deskewed/restamped
          data_type: "PointCloud2"
          sensor_frame: utlidar_lidar
          observation_persistence: 0.0   # 0 = persist until raycasted clear
          expected_update_rate: 0.0
          min_obstacle_height: 0.15     # Go2 ground clearance ~0.18 m; filters floor + leg returns
          max_obstacle_height: 2.0
          inf_is_valid: false
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
