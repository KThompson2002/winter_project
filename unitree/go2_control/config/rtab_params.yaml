rtabmap:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    map_frame_id: map
    subscribe_depth: True
    subscribe_scan_cloud: True
    approx_sync: True
    queue_size: 10
    use_action_for_goal: True
    Mem/IncrementalMemory: 'true'
    Reg/Strategy: '2'
    Reg/Force3DoF: 'false'

    Grid/3D: 'true'
    Grid/FromDepth: 'false'

    # Floor / ceiling filtering for RTAB-Map's own occupancy grid (/map)
    # Points below MinGroundHeight are treated as ground and excluded from obstacles.
    # Go2 ground clearance ~0.18 m; use a small positive value to absorb tilt noise.
    Grid/MinGroundHeight: '0.1'         # points below 0.1 m from base_link = ground, ignored
    Grid/MaxObstacleHeight: '2.0'       # points above 2.0 m also ignored
    Grid/RayTracing: 'true'             # ray-trace free space to clear cells behind obstacles
    Grid/CellSize: '0.05'              # match Nav2 costmap resolution

    # How much of the local map is kept for scan-matching (OdomF2M)
    # Larger = more context for ICP, but heavier. 10 000 pts is a safe default.
    OdomF2M/MaxSize: '10000'

    Vis/MaxDepth: '3.0'
    Vis/MinInliers: '10'
    approx_sync_max_interval: 1.0

