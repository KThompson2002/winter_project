rtabmap:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    map_frame_id: map
    subscribe_depth: True
    subscribe_scan_cloud: True
    approx_sync: True
    queue_size: 10
    use_action_for_goal: True
    Mem/IncrementalMemory: 'true'
    Reg/Strategy: '2'
    Reg/Force3DoF: 'false'

    Grid/3D: 'false'
    Grid/FromDepth: 'false'

    # Floor / ceiling filtering for RTAB-Map's own occupancy grid (/map).
    # Heights are in base_link frame; ground is at ~-0.28 m, LiDAR at z=-0.066 m.
    # Nav2 local costmap uses min_obstacle_height=0.15 m in world frame (ground=0).
    # Equivalent in base_link: 0.15 - 0.29 = -0.14 m. Using -0.15 m for small margin.
    Grid/MinGroundHeight: '-0.15'
    Grid/MaxObstacleHeight: '2.0'
    Grid/RayTracing: 'true'
    Grid/CellSize: '0.05'

    # How much of the local map is kept for scan-matching (OdomF2M)
    # Larger = more context for ICP, but heavier. 10 000 pts is a safe default.
    OdomF2M/MaxSize: '10000'

    Vis/MaxDepth: '3.0'
    Vis/MinInliers: '10'
    approx_sync_max_interval: 1.0

    # 1 Hz gives the Livox MID360 a full second of non-repetitive scan data
    # per keyframe, producing complete area coverage instead of thin arms.
    # Increasing this causes sparse spoke-like map artifacts.
    Rtabmap/DetectionRate: '1'

